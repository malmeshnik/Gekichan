upstream backend {
    server backend:8000;
}

# ---------------------------------------------------------
# 1. HTTP СЕРВЕР: Повний редирект на HTTPS (крім Certbot)
# ---------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name theandriy.xyz;

    # Залишаємо для майбутніх автопродовжень сертифікатів (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Усі інші запити по HTTP перенаправляємо на безпечний HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------
# 2. HTTPS СЕРВЕР: Основна робота фронтенду та бекенду
# ---------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name theandriy.xyz;

    # Максимальний розмір файлів для завантаження (наприклад, медіа)
    client_max_body_size 50M;

    # Шляхи до твоїх нових SSL сертифікатів Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/theandriy.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theandriy.xyz/privkey.pem;

    # Налаштування безпеки SSL (сучасні протоколи)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # -------------------------
    # FRONTEND (React build)
    # -------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # -------------------------
    # BACKEND API (Django)
    # -------------------------
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------
    # STATIC & MEDIA FILES (Django)
    # -------------------------
    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }
}